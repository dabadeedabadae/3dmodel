# Whole FitCast locally: docker compose up --build  →  http://localhost:3001
# Ports can be changed in .env next to this file (WEB_PORT, API_PORT, DB_PORT, REC_PORT); see docs/ONBOARDING.md.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fitcast
      POSTGRES_PASSWORD: fitcast
      POSTGRES_DB: fitcast
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitcast -d fitcast"]
      interval: 3s
      timeout: 3s
      retries: 20

  recommendation:
    build: ./recommendation-service
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REC_PORT:-8010}:8010"

  api:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://fitcast:fitcast@postgres:5432/fitcast?schema=public
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      JWT_EXPIRES_IN: 1d
      PORT: 3002
      # the browser's origin (CORS for the API and for garment textures)
      FRONTEND_ORIGIN: http://localhost:${WEB_PORT:-3001}
      RECOMMENDATION_SERVICE_URL: http://recommendation:8010
    ports:
      - "127.0.0.1:${API_PORT:-3002}:3002"
    volumes:
      - uploads:/app/uploads

  web:
    build:
      context: ./frontend
      args:
        # the API as the BROWSER reaches it (not the container name)
        NEXT_PUBLIC_API_URL: http://localhost:${API_PORT:-3002}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "127.0.0.1:${WEB_PORT:-3001}:3001"

volumes:
  postgres_data:
  uploads:
