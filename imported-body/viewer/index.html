<!doctype html>
<html lang="ru"><head><meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" />
<title>FitCast · манекен с ползунками</title>
<style>
 html,body{margin:0;height:100%;background:#eceef2;font:13px/1.45 system-ui,sans-serif;color:#1f2430}
 #app{display:flex;height:100%}
 .vp{position:relative}
 .panel{width:300px;padding:14px 16px;border-left:1px solid #d6d9e0;background:#fff;overflow:auto}
 h3{margin:0 0 10px;font-size:14px}
 label{display:block;margin:10px 0 2px;font-size:12px;color:#4a5160}
 input[type=range]{width:100%}
 .cm{background:#f4f5f8;border:1px solid #e2e5ec;border-radius:6px;padding:8px;margin-bottom:8px;font-size:12px}
 .cm b{font-variant-numeric:tabular-nums}
 .u{color:#8b92a1}
 .row{display:flex;flex-wrap:wrap;gap:4px;margin-top:12px}
 button{font:12px system-ui;padding:4px 8px;border:1px solid #cfd3dc;background:#fafbfc;border-radius:5px;cursor:pointer}
 .note{color:#79808f;font-size:11px;margin:12px 0 0}
</style></head>
<body><div id="app"></div><script type="module" src="./main.ts"></script></body></html>
